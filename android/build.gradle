buildscript {
    ext.safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.0.21')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

// Generates the RNLiquidGlassViewManagerDelegate/Interface types that the view managers implement.
// The plugin reads `codegenConfig` from package.json and is supplied by the consuming app, whose
// settings.gradle includes the `@react-native/gradle-plugin` composite build. Without this the
// managers reference classes that no consumer build ever produces.
apply plugin: 'com.facebook.react'

android {
    namespace 'io.github.griffinkrutherford.liquidglass.react'
    compileSdk safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 23)
        targetSdk safeExtGet('targetSdkVersion', 35)
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main.java.srcDirs += [
            '../liquid-glass-core/src/main/kotlin',
            '../liquid-glass-view/src/main/java',
            layout.buildDirectory.dir('generated/source/codegen/java').get().asFile
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-android'
}
