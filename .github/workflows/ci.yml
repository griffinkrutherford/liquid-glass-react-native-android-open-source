name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run android:bridge-check
      - run: npm test -- --runInBand
      - run: npm run test:pack
      - run: ./gradlew test lintDebug :sample-android:assembleDebug

  consumer-app:
    name: Packed consumer (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Fabric
            new_arch: 'true'
            tasks: assembleDebug assembleRelease
          - architecture: Legacy
            new_arch: 'false'
            tasks: assembleDebug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install consumer Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install library toolchain
        run: npm ci
      - name: Pack and install library into example
        run: npm run example:install
      - name: Typecheck installed consumer
        run: npm run example:typecheck
      - name: Bundle installed consumer
        run: npm run example:bundle
      - name: Build installed consumer
        working-directory: example-react-native/android
        run: >-
          ./gradlew ${{ matrix.tasks }}
          -PnewArchEnabled=${{ matrix.new_arch }}
          -PreactNativeArchitectures=x86_64
